name: keepwarm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: keepwarm
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the game server
        run: curl -sS --max-time 20 --retry 2 --retry-delay 3 --retry-all-errors https://sniper-chill-mp.onrender.com/healthz || true
